    <style>
      /* Sidebar Account Section - Fixed position, Hover Flyout to Right */
      .sidebar-account-footer {
        position: relative !important;
      }
      .sidebar-account-card-wrapper {
        position: relative !important;
      }
      .sidebar-account-card {
        transition: background-color 0.2s ease, border-color 0.2s ease;
        transform: none !important;
        margin: 0 !important;
        cursor: pointer;
      }
      .sidebar-account-card:hover {
        background: rgba(30, 41, 59, 0.9) !important;
        border-color: rgba(16, 185, 129, 0.4) !important;
      }
      .sidebar-account-flyout {
        position: absolute;
        left: 100%;
        bottom: 0;
        margin-left: 12px;
        min-width: 210px;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
        transform: translateX(-10px);
        z-index: 99999 !important;
        background: #0f172a !important;
        border: 1px solid rgba(255, 255, 255, 0.12) !important;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5) !important;
        border-radius: 14px !important;
        padding: 8px !important;
      }
      /* Invisible hover bridge between card and flyout to prevent accidental closing */
      .sidebar-account-card-wrapper::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 100%;
        width: 16px;
      }
      /* Hover Trigger */
      .sidebar-account-card-wrapper:hover .sidebar-account-flyout,
      .sidebar-account-flyout:hover {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateX(0);
      }
      .sidebar-account-flyout .dropdown-item:hover {
        background-color: rgba(255, 255, 255, 0.08) !important;
      }
    </style>
